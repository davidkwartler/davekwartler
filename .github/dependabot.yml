version: 2
updates:
  # One grouped PR a week for minor and patch bumps; majors arrive alone.
  # Security fixes skip the schedule but still arrive as one PR per ecosystem
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before proposing it, so a hijacked or
    # yanked version is usually caught upstream first
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  # Keeps the SHA-pinned actions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
